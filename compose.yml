services:
  mysql:
    image: mysql:8.4
    container_name: power-mysql
    environment:
      MYSQL_DATABASE: personal_project
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MYSQL_ROOT_PASSWORD: rootpassword
      TZ: Asia/Seoul
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: power-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 9096
      DB_URL: jdbc:mysql://mysql:3306/personal_project?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: appuser
      DB_PASSWORD: apppassword
      CORS_ALLOWED_ORIGINS: http://localhost:9090,http://127.0.0.1:9090
    ports:
      - "9096:9096"

  frontend:
    build:
      context: ./frontend
    container_name: power-frontend
    depends_on:
      - backend
    environment:
      VITE_API_PROXY_TARGET: http://backend:9096
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "9090:9090"

volumes:
  mysql-data:
