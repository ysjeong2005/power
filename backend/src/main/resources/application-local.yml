spring:
  datasource:
    url: jdbc:h2:mem:power;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update

app:
  cors:
    allowed-origins: http://localhost:9090,http://127.0.0.1:9090
